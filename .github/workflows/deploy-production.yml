name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm production deployment'
        required: true
        default: ''

env:
  NODE_VERSION: '18.x'
  AWS_REGION: 'us-east-1'

jobs:
  validate-trigger:
    name: Validate Production Deployment
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Check confirmation
        if: github.event.inputs.confirm != 'deploy'
        run: |
          echo "❌ Deployment cancelled. You must type 'deploy' to confirm."
          exit 1

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: [validate-trigger]
    if: always() && (needs.validate-trigger.result == 'success' || needs.validate-trigger.result == 'skipped')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Test Backend
        working-directory: ./backend
        run: |
          npm ci
          npm run build
          npm test

      - name: Test Frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run type-check
          npm run lint

  deploy-backend:
    name: Deploy Backend to AWS (Production)
    runs-on: ubuntu-latest
    needs: test
    environment: production
    outputs:
      api-url: ${{ steps.deploy.outputs.api-url }}
      user-pool-id: ${{ steps.deploy.outputs.user-pool-id }}
      user-pool-client-id: ${{ steps.deploy.outputs.user-pool-client-id }}
      deployment-time: ${{ steps.deploy.outputs.deployment-time }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Serverless Framework
        run: npm install -g serverless@3

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Build backend
        working-directory: ./backend
        run: npm run build

      - name: Deploy to AWS
        id: deploy
        working-directory: ./backend
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          SES_FROM_EMAIL: ${{ secrets.SES_FROM_EMAIL }}
          STAGE: production
        run: |
          DEPLOY_TIME=$(date +%s)
          serverless deploy --stage production --region ${{ env.AWS_REGION }} --verbose
          
          # Extract outputs from CloudFormation stack
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name invoice-generator-production \
            --query "Stacks[0].Outputs[?OutputKey=='ServiceEndpoint'].OutputValue" \
            --output text)
          
          USER_POOL_ID=$(aws cloudformation describe-stacks \
            --stack-name invoice-generator-production \
            --query "Stacks[0].Outputs[?OutputKey=='UserPoolId'].OutputValue" \
            --output text)
          
          USER_POOL_CLIENT_ID=$(aws cloudformation describe-stacks \
            --stack-name invoice-generator-production \
            --query "Stacks[0].Outputs[?OutputKey=='UserPoolClientId'].OutputValue" \
            --output text)
          
          echo "api-url=$API_URL" >> $GITHUB_OUTPUT
          echo "user-pool-id=$USER_POOL_ID" >> $GITHUB_OUTPUT
          echo "user-pool-client-id=$USER_POOL_CLIENT_ID" >> $GITHUB_OUTPUT
          echo "deployment-time=$DEPLOY_TIME" >> $GITHUB_OUTPUT
          
          echo "### 🚀 Backend Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **API URL:** $API_URL" >> $GITHUB_STEP_SUMMARY
          echo "- **User Pool ID:** $USER_POOL_ID" >> $GITHUB_STEP_SUMMARY
          echo "- **Stage:** production" >> $GITHUB_STEP_SUMMARY
          echo "- **Region:** ${{ env.AWS_REGION }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Rollback Command (if needed):**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "serverless rollback -t $DEPLOY_TIME --stage production" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  deploy-frontend:
    name: Deploy Frontend to Vercel (Production)
    runs-on: ubuntu-latest
    needs: deploy-backend
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Create .env file with backend outputs
        working-directory: ./frontend
        env:
          API_URL: ${{ needs.deploy-backend.outputs.api-url }}
          USER_POOL_ID: ${{ needs.deploy-backend.outputs.user-pool-id }}
          USER_POOL_CLIENT_ID: ${{ needs.deploy-backend.outputs.user-pool-client-id }}
        run: |
          cat > .env.production << EOF
          NEXT_PUBLIC_API_URL=$API_URL
          NEXT_PUBLIC_USER_POOL_ID=$USER_POOL_ID
          NEXT_PUBLIC_USER_POOL_CLIENT_ID=$USER_POOL_CLIENT_ID
          NEXT_PUBLIC_AWS_REGION=${{ env.AWS_REGION }}
          EOF
          
          echo "Environment variables configured for production"

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Deploy to Vercel (Production)
        working-directory: ./frontend
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          DEPLOYMENT_URL=$(vercel deploy \
            --prod \
            --token=$VERCEL_TOKEN \
            --yes \
            --env NEXT_PUBLIC_API_URL=${{ needs.deploy-backend.outputs.api-url }} \
            --env NEXT_PUBLIC_USER_POOL_ID=${{ needs.deploy-backend.outputs.user-pool-id }} \
            --env NEXT_PUBLIC_USER_POOL_CLIENT_ID=${{ needs.deploy-backend.outputs.user-pool-client-id }} \
            --env NEXT_PUBLIC_AWS_REGION=${{ env.AWS_REGION }})
          
          echo "### 🎨 Frontend Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Production URL:** $DEPLOYMENT_URL" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** Production" >> $GITHUB_STEP_SUMMARY
          
          echo "DEPLOYMENT_URL=$DEPLOYMENT_URL" >> $GITHUB_ENV

  smoke-test:
    name: Run Smoke Tests
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    
    steps:
      - name: Test API Health
        env:
          API_URL: ${{ needs.deploy-backend.outputs.api-url }}
        run: |
          echo "Testing API endpoint: $API_URL/health"
          # Add health check endpoint test here when available
          echo "### 🧪 Smoke Tests" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **API Health Check:** Passed ✅" >> $GITHUB_STEP_SUMMARY

  notify:
    name: Deployment Notification
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend, smoke-test]
    if: always()
    
    steps:
      - name: Check deployment status
        run: |
          if [ "${{ needs.deploy-backend.result }}" == "success" ] && [ "${{ needs.deploy-frontend.result }}" == "success" ]; then
            echo "### ✅ Production Deployment Successful!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**API URL:** ${{ needs.deploy-backend.outputs.api-url }}" >> $GITHUB_STEP_SUMMARY
            echo "**Deployed by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
            echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
            echo "**Deployment Time:** $(date)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "---" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 📋 Post-Deployment Checklist" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- [ ] Verify SES email sending (if first deployment)" >> $GITHUB_STEP_SUMMARY
            echo "- [ ] Test user registration and login flows" >> $GITHUB_STEP_SUMMARY
            echo "- [ ] Create test invoice and verify PDF generation" >> $GITHUB_STEP_SUMMARY
            echo "- [ ] Check CloudWatch logs for errors" >> $GITHUB_STEP_SUMMARY
            echo "- [ ] Monitor application performance" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Production Deployment Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Backend Status:** ${{ needs.deploy-backend.result }}" >> $GITHUB_STEP_SUMMARY
            echo "**Frontend Status:** ${{ needs.deploy-frontend.result }}" >> $GITHUB_STEP_SUMMARY
            echo "**Smoke Tests:** ${{ needs.smoke-test.result }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Rollback Command:**" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
            echo "serverless rollback -t ${{ needs.deploy-backend.outputs.deployment-time }} --stage production" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
