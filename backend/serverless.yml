service: invoice-generator-api

frameworkVersion: '3'

package:
  individually: true

provider:
  name: aws
  runtime: nodejs18.x
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-east-1'}
  memorySize: 512
  timeout: 30
  environment:
    STAGE: ${self:provider.stage}
    REGION: ${self:provider.region}
    INVOICES_TABLE: ${self:custom.invoicesTable}
    USERS_TABLE: ${self:custom.usersTable}
    CLIENTS_TABLE: ${self:custom.clientsTable}
    COMPANY_SETTINGS_TABLE: ${self:custom.companySettingsTable}
    EMAIL_TEMPLATES_TABLE: ${self:custom.emailTemplatesTable}
    INVOICES_BUCKET: ${self:custom.invoicesBucket}
    USER_POOL_ID: ${self:custom.userPoolId}
    USER_POOL_CLIENT_ID: ${self:custom.userPoolClientId}
    SES_FROM_EMAIL: ${env:SES_FROM_EMAIL, 'noreply@invoicegenerator.com'}
  iam:
    role:
      statements:
        # DynamoDB permissions
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource:
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:custom.invoicesTable}
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:custom.usersTable}
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:custom.clientsTable}
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:custom.companySettingsTable}
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:custom.emailTemplatesTable}
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:custom.invoicesTable}/index/*
        # S3 permissions
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
            - s3:DeleteObject
          Resource:
            - arn:aws:s3:::${self:custom.invoicesBucket}/*
        # SES permissions
        - Effect: Allow
          Action:
            - ses:SendEmail
            - ses:SendRawEmail
          Resource: '*'
        # Cognito permissions for password changes
        - Effect: Allow
          Action:
            - cognito-idp:AdminUpdateUserAttributes
            - cognito-idp:AdminSetUserPassword
          Resource:
            - arn:aws:cognito-idp:${self:provider.region}:*:userpool/*

custom:
  invoicesTable: ${self:service}-invoices-${self:provider.stage}
  usersTable: ${self:service}-users-${self:provider.stage}
  clientsTable: ${self:service}-clients-${self:provider.stage}
  companySettingsTable: ${self:service}-company-settings-${self:provider.stage}
  emailTemplatesTable: ${self:service}-email-templates-${self:provider.stage}
  invoicesBucket: ${self:service}-pdfs-${self:provider.stage}
  userPoolId: ${env:USER_POOL_ID, 'YOUR_COGNITO_USER_POOL_ID'}
  userPoolClientId: ${env:USER_POOL_CLIENT_ID, 'YOUR_COGNITO_CLIENT_ID'}
  
  cors:
    origin: '*'
    headers:
      - Content-Type
      - X-Amz-Date
      - Authorization
      - X-Api-Key
      - X-Amz-Security-Token
    allowCredentials: false
    maxAge: 86400
  
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    exclude:
      - aws-sdk
    target: node18
    platform: node
    concurrency: 10
    external:
      - '@sparticuz/chromium'
  
  serverless-offline:
    httpPort: 3001
    noPrependStageInUrl: true

plugins:
  - serverless-esbuild
  - serverless-offline
  - serverless-dotenv-plugin

functions:
  # Auth functions
  signup:
    handler: functions/auth/signup.handler
    events:
      - http:
          path: /auth/signup
          method: post
          cors: ${self:custom.cors}

  login:
    handler: functions/auth/login.handler
    events:
      - http:
          path: /auth/login
          method: post
          cors: ${self:custom.cors}

  confirmSignup:
    handler: functions/auth/confirm-signup.handler
    events:
      - http:
          path: /auth/confirm-signup
          method: post
          cors: ${self:custom.cors}

  resendConfirmation:
    handler: functions/auth/resend-confirmation.handler
    events:
      - http:
          path: /auth/resend-confirmation
          method: post
          cors: ${self:custom.cors}

  # Invoice CRUD operations
  createInvoice:
    handler: functions/invoices/create.handler
    events:
      - http:
          path: /invoices
          method: post
          cors: ${self:custom.cors}
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId:
              Ref: ApiGatewayAuthorizer

  getInvoice:
    handler: functions/invoices/get.handler
    events:
      - http:
          path: /invoices/{invoiceId}
          method: get
          cors: ${self:custom.cors}
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId:
              Ref: ApiGatewayAuthorizer

  listInvoices:
    handler: functions/invoices/list.handler
    events:
      - http:
          path: /invoices
          method: get
          cors: ${self:custom.cors}
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId:
              Ref: ApiGatewayAuthorizer

  updateInvoice:
    handler: functions/invoices/update.handler
    events:
      - http:
          path: /invoices/{invoiceId}
          method: put
          cors: ${self:custom.cors}
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId:
              Ref: ApiGatewayAuthorizer

  deleteInvoice:
    handler: functions/invoices/delete.handler
    events:
      - http:
          path: /invoices/{invoiceId}
          method: delete
          cors: ${self:custom.cors}
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId:
              Ref: ApiGatewayAuthorizer

  updateInvoiceStatus:
    handler: functions/invoices/update-status.handler
    events:
      - http:
          path: /invoices/{invoiceId}/status
          method: patch
          cors: ${self:custom.cors}
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId:
              Ref: ApiGatewayAuthorizer

  # Client management
  createClient:
    handler: functions/clients/create.handler
    events:
      - http:
          path: /clients
          method: post
          cors: ${self:custom.cors}
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId:
              Ref: ApiGatewayAuthorizer

  getClient:
    handler: functions/clients/get.handler
    events:
      - http:
          path: /clients/{clientId}
          method: get
          cors: ${self:custom.cors}
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId:
              Ref: ApiGatewayAuthorizer

  listClients:
    handler: functions/clients/list.handler
    events:
      - http:
          path: /clients
          method: get
          cors: ${self:custom.cors}
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId:
              Ref: ApiGatewayAuthorizer

  updateClient:
    handler: functions/clients/update.handler
    events:
      - http:
          path: /clients/{clientId}
          method: put
          cors: ${self:custom.cors}
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId:
              Ref: ApiGatewayAuthorizer

  deleteClient:
    handler: functions/clients/delete.handler
    events:
      - http:
          path: /clients/{clientId}
          method: delete
          cors: ${self:custom.cors}
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId:
              Ref: ApiGatewayAuthorizer

  # PDF generation
  generatePDF:
    handler: functions/pdf/generate.handler
    memorySize: 1024
    timeout: 29
    package:
      patterns:
        - 'functions/pdf/**'
        - 'libs/**'
        - 'models/**'
        - 'node_modules/@sparticuz/**'
        - 'node_modules/puppeteer-core/**'
        - 'node_modules/@aws-sdk/**'
        - '!node_modules/**/.bin'
        - '!node_modules/**/test/**'
    events:
      - http:
          path: /invoices/{invoiceId}/pdf
          method: post
          cors: ${self:custom.cors}
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId:
              Ref: ApiGatewayAuthorizer

  # Email invoice
  emailInvoice:
    handler: functions/email/send.handler
    events:
      - http:
          path: /invoices/{invoiceId}/email
          method: post
          cors: ${self:custom.cors}
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId:
              Ref: ApiGatewayAuthorizer

  # User Settings
  getProfile:
    handler: functions/settings/profile.handler
    events:
      - http:
          path: /settings/profile
          method: get
          cors: ${self:custom.cors}
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId:
              Ref: ApiGatewayAuthorizer

  updateProfile:
    handler: functions/settings/profile.handler
    events:
      - http:
          path: /settings/profile
          method: put
          cors: ${self:custom.cors}
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId:
              Ref: ApiGatewayAuthorizer

  getCompanySettings:
    handler: functions/settings/company.handler
    events:
      - http:
          path: /settings/company
          method: get
          cors: ${self:custom.cors}
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId:
              Ref: ApiGatewayAuthorizer

  updateCompanySettings:
    handler: functions/settings/company.handler
    events:
      - http:
          path: /settings/company
          method: put
          cors: ${self:custom.cors}
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId:
              Ref: ApiGatewayAuthorizer

  getEmailTemplate:
    handler: functions/settings/email-template.handler
    events:
      - http:
          path: /settings/email-template
          method: get
          cors: ${self:custom.cors}
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId:
              Ref: ApiGatewayAuthorizer

  updateEmailTemplate:
    handler: functions/settings/email-template.handler
    events:
      - http:
          path: /settings/email-template
          method: put
          cors: ${self:custom.cors}
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId:
              Ref: ApiGatewayAuthorizer

  changePassword:
    handler: functions/settings/change-password.handler
    events:
      - http:
          path: /settings/change-password
          method: post
          cors: ${self:custom.cors}
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId:
              Ref: ApiGatewayAuthorizer

  uploadLogo:
    handler: functions/settings/upload-logo.handler
    events:
      - http:
          path: /settings/upload-logo
          method: post
          cors: ${self:custom.cors}
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId:
              Ref: ApiGatewayAuthorizer

resources:
  Resources:
    # Cognito User Pool
    CognitoUserPool:
      Type: AWS::Cognito::UserPool
      Properties:
        UserPoolName: ${self:service}-user-pool-${self:provider.stage}
        AutoVerifiedAttributes:
          - email
        UsernameAttributes:
          - email
        Schema:
          - Name: email
            Required: true
            Mutable: false
          - Name: name
            Required: true
            Mutable: true
        Policies:
          PasswordPolicy:
            MinimumLength: 8
            RequireLowercase: true
            RequireNumbers: true
            RequireSymbols: true
            RequireUppercase: true

    CognitoUserPoolClient:
      Type: AWS::Cognito::UserPoolClient
      Properties:
        ClientName: ${self:service}-user-pool-client-${self:provider.stage}
        UserPoolId:
          Ref: CognitoUserPool
        ExplicitAuthFlows:
          - ALLOW_USER_PASSWORD_AUTH
          - ALLOW_REFRESH_TOKEN_AUTH
        GenerateSecret: false

    # API Gateway Authorizer
    ApiGatewayAuthorizer:
      Type: AWS::ApiGateway::Authorizer
      Properties:
        Name: CognitoAuthorizer
        Type: COGNITO_USER_POOLS
        IdentitySource: method.request.header.Authorization
        RestApiId:
          Ref: ApiGatewayRestApi
        ProviderARNs:
          - Fn::GetAtt: [CognitoUserPool, Arn]

    # DynamoDB Tables
    InvoicesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.invoicesTable}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
          - AttributeName: userId
            AttributeType: S
          - AttributeName: createdAt
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: UserIdIndex
            KeySchema:
              - AttributeName: userId
                KeyType: HASH
              - AttributeName: createdAt
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

    UsersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.usersTable}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
          - AttributeName: email
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: EmailIndex
            KeySchema:
              - AttributeName: email
                KeyType: HASH
            Projection:
              ProjectionType: ALL

    ClientsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.clientsTable}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: userId
            AttributeType: S
          - AttributeName: id
            AttributeType: S
          - AttributeName: createdAt
            AttributeType: S
        KeySchema:
          - AttributeName: userId
            KeyType: HASH
          - AttributeName: id
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: UserCreatedIndex
            KeySchema:
              - AttributeName: userId
                KeyType: HASH
              - AttributeName: createdAt
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

    CompanySettingsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.companySettingsTable}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: userId
            AttributeType: S
        KeySchema:
          - AttributeName: userId
            KeyType: HASH

    EmailTemplatesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.emailTemplatesTable}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: userId
            AttributeType: S
        KeySchema:
          - AttributeName: userId
            KeyType: HASH

    # S3 Bucket for PDFs
    InvoicesBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:custom.invoicesBucket}
        CorsConfiguration:
          CorsRules:
            - AllowedOrigins:
                - '*'
              AllowedHeaders:
                - '*'
              AllowedMethods:
                - GET
                - PUT
                - POST
                - DELETE
              MaxAge: 3000
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true

  Outputs:
    ApiEndpoint:
      Description: API Gateway endpoint URL
      Value:
        Fn::Sub: https://${ApiGatewayRestApi}.execute-api.${self:provider.region}.amazonaws.com/${self:provider.stage}
    
    UserPoolId:
      Description: Cognito User Pool ID
      Value:
        Ref: CognitoUserPool
    
    UserPoolClientId:
      Description: Cognito User Pool Client ID
      Value:
        Ref: CognitoUserPoolClient
    
    InvoicesBucket:
      Description: S3 Bucket for invoice PDFs
      Value:
        Ref: InvoicesBucket
